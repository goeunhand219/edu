// fake record context
const RECORD = { item: '슬라임', amount: 3000 };

// ─────────── particles ───────────
function StarField() {
  const ref = useRef();
  useEffect(() => {
    const c = ref.current; const ctx = c.getContext('2d');
    const w = c.width = c.offsetWidth * devicePixelRatio;
    const h = c.height = c.offsetHeight * devicePixelRatio;
    const stars = Array.from({ length: 50 }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: (Math.random() * 1.2 + 0.4) * devicePixelRatio,
      vy: -(Math.random() * 0.2 + 0.04) * devicePixelRatio,
      a: Math.random() * 0.55 + 0.2, tw: Math.random() * Math.PI * 2,
    }));
    let raf;
    const tick = () => {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        s.y += s.vy; s.tw += 0.04;
        if (s.y < -5) { s.y = h + 5; s.x = Math.random() * w; }
        const a = s.a * (0.6 + 0.4 * Math.sin(s.tw));
        ctx.fillStyle = `rgba(255, 240, 200, ${a})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      raf = requestAnimationFrame(tick);
    };
    tick();
    return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={ref} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none' }}/>;
}

// ─────────── Monster blob ───────────
function Monster({ m, shake }) {
  return (
    <div style={{
      position: 'relative',
      animation: shake ? 'monsterShake .25s ease-in-out infinite' : 'monsterIdle 1.6s ease-in-out infinite',

            <stop offset="60%" stopColor={m.color} stopOpacity="0.95"/>

        {/* spiky blob */}

          C 180,80 184,110 168,128
          C 174,150 152,176 124,170
          C 110,184 86,182 72,170

        <circle cx="120" cy="103" r="6" fill="#1a0303"/>
        <circle cx="82" cy="101" r="2" fill="#fff"/>
        <circle cx="122" cy="101" r="2" fill="#fff"/>

        ) : (

        <g style={{ transformOrigin: '100px 100px', animation: 'spinSlow 4s linear infinite' }}>
          <circle cx="20" cy="100" r="2.5" fill={m.dark}/>
          <circle cx="180" cy="100" r="2" fill={m.dark}/>

        </g>
      </svg>
      {/* speech bubble */}
      <div style={{
        position: 'absolute', top: -14, left: '50%', transform: 'translateX(-50%)',
        background: 'rgba(0,0,0,0.7)', color: '#fff', fontSize: 11, fontWeight: 700,
        padding: '6px 12px', borderRadius: 10, whiteSpace: 'pre-line', textAlign: 'center',

  );
}

// ─────────── Friend orb ───────────
function Friend({ f }) {

        border: `1.5px dashed ${f.color}88`,

      }}/>
      <svg width="200" height="200" viewBox="0 0 200 200">

          <radialGradient id="fb" cx="35%" cy="30%">

        <circle cx="82" cy="98" r="1.6" fill="#fff"/>
        <circle cx="122" cy="98" r="1.6" fill="#fff"/>
        {/* cheeks */}
        <ellipse cx="74" cy="116" rx="6" ry="3.5" fill="#F472B6" opacity="0.55"/>
        <ellipse cx="126" cy="116" rx="6" ry="3.5" fill="#F472B6" opacity="0.55"/>
        {/* smile */}
        <path d="M85 122 Q100 134 115 122" stroke="#1E1B4B" strokeWidth="3" fill="none" strokeLinecap="round"/>
        {/* tiny crown of emoji */}
        <text x="100" y="48" fontSize="22" textAnchor="middle">{f.emoji}</text>
      </svg>
      {/* sparkles */}
      <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
        {[
          {x: 14, y: 30, d: 0},
          {x: 178, y: 50, d: 0.4},
          {x: 24, y: 150, d: 0.8},
          {x: 170, y: 160, d: 1.2},
          {x: 100, y: 6, d: 1.6},

          <div key={i} style={{

            fontSize: 14, color: f.glow,
            animation: `twinkle 1.6s ease-in-out infinite`,

}

// ─────────── Cast effect (water orb) ───────────
function CastEffect({ magic, monsterColor }) {
  return (
    <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', zIndex: 30 }}>
      {/* radial flash */}
      <div style={{
        position: 'absolute', left: '50%', top: '50%', transform: 'translate(-50%,-50%)',
        width: 60, height: 60, borderRadius: '50%',
        background: `radial-gradient(circle, ${magic.glow} 0%, ${magic.color} 40%, transparent 75%)`,
        animation: 'flashGrow .8s ease-out forwards',
        boxShadow: `0 0 40px ${magic.color}`,
      }}/>
      {/* concentric rings */}
      {[0, 0.15, 0.3].map((d, i) => (
        <div key={i} style={{
          position: 'absolute', left: '50%', top: '50%', transform: 'translate(-50%,-50%)',
          width: 60, height: 60, borderRadius: '50%',
          border: `2px solid ${magic.color}`,
          animation: `ringPulse 1.1s ease-out forwards`,
          animationDelay: `${d}s`,
          opacity: 0,
        }}/>
      ))}
      {/* shards */}
      {[0,1,2,3,4,5,6,7].map(i => {
        const a = (i / 8) * Math.PI * 2;
        return (
          <div key={i} style={{
            position: 'absolute', left: '50%', top: '50%',
            width: 4, height: 24, marginLeft: -2, marginTop: -12,
            background: `linear-gradient(to bottom, ${magic.glow}, transparent)`,
            transform: `rotate(${a}rad) translateY(-30px)`,
            transformOrigin: '50% 50%',
            animation: 'shardOut .9s ease-out forwards',
            animationDelay: `${i * 0.02}s`,
            borderRadius: 2,
          }}/>
        );
      })}
    </div>
  );
}

// ─────────── Phase: emotion picker (top-right debug for demo) ───────────
function PhaseSwitcher({ value, onChange }) {
  return (
    <div style={{
      position: 'absolute', top: 12, right: 12, zIndex: 50,
      display: 'flex', gap: 4, padding: 4,
      background: 'rgba(0,0,0,0.45)', borderRadius: 999,
      border: '1px solid rgba(255,255,255,0.12)', backdropFilter: 'blur(8px)',
    }}>
      {Object.keys(PAIRS).map(k => (
        <button key={k} onClick={() => onChange(k)} title={PAIRS[k].fromLabel.split(' ')[1]}
          style={{
            width: 28, height: 28, border: 'none', borderRadius: 999, cursor: 'pointer',
            background: value === k ? '#FBBF24' : 'transparent',
            color: value === k ? '#1E1B4B' : 'rgba(255,255,255,0.6)',
            fontSize: 14, fontFamily: 'inherit',
          }}>
          {PAIRS[k].fromLabel.split(' ')[0]}
        </button>
      ))}
    </div>
  );
}

// ─────────── Screen 4 ───────────
const PHASES = ['intro', 'monster', 'casting', 'reveal', 'collected'];

function Screen4() {
  const [emotion, setEmotion] = useState(STORED_EMOTION && PAIRS[STORED_EMOTION] ? STORED_EMOTION : 'impulse');
  const pair = PAIRS[emotion];
  const hasMonster = !!pair.monster;
  const [phase, setPhase] = useState(hasMonster ? 'intro' : 'reveal');

  // reset when emotion changes
  useEffect(() => {
    setPhase(PAIRS[emotion].monster ? 'intro' : 'reveal');
  }, [emotion]);

  // auto-advance casting → reveal
  useEffect(() => {
    if (phase === 'casting') {
      const t = setTimeout(() => setPhase('reveal'), 1100);
      return () => clearTimeout(t);
    }
  }, [phase]);

  const advance = () => {
    if (phase === 'collected') { window.location.href = 'screen2.html'; return; }
    if (phase === 'intro') setPhase('monster');
    else if (phase === 'monster') setPhase('casting');
    else if (phase === 'reveal') setPhase('collected');
    else if (phase === 'collected') setPhase(hasMonster ? 'intro' : 'reveal');
  };

  // CTA copy per phase
  const ctaCopy = {
    intro: '누가 왔는지 보러 가기 →',
    monster: `✨ ${MAGIC.name} 마법으로 변신시켜!`,
    casting: '...',
    reveal: '도감에 추가하기 →',
    collected: '메인으로 돌아가기  ↩',
  }[phase];

  // background tone shifts with phase
  const bgGrad = phase === 'monster' || phase === 'intro'
    ? 'radial-gradient(120% 80% at 50% 0%, #581C87 0%, #312E81 40%, #0c0a3e 100%)'
    : phase === 'casting'
    ? `radial-gradient(circle at 50% 50%, ${MAGIC.color}55 0%, #312E81 50%, #1E1B4B 100%)`
    : `radial-gradient(120% 80% at 50% 0%, ${pair.friend.color}33 0%, #312E81 40%, #1E1B4B 100%)`;

  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: bgGrad,
      transition: 'background .6s ease',
      overflow: 'hidden',
      display: 'flex', flexDirection: 'column',
    }}>
      <StarField/>
      <button
        onClick={() => { window.location.href = 'screen2.html'; }}
        title="대시보드로"
        style={{
          position: 'absolute', top: 12, left: 12, zIndex: 50,
          background: 'rgba(0,0,0,0.45)', border: '1px solid rgba(255,255,255,0.18)',
          color: '#fff', borderRadius: 999, padding: '6px 12px',
          fontSize: 12, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit',
          display: 'flex', alignItems: 'center', gap: 6,
        }}
      >🏠 <span>대시보드</span></button>
      <PhaseSwitcher value={emotion} onChange={setEmotion}/>

      {/* top label */}
      <div style={{ position: 'relative', zIndex: 5, paddingTop: 60, textAlign: 'center' }}>
        <div style={{
          display: 'inline-flex', alignItems: 'center', gap: 6,
          padding: '6px 14px', borderRadius: 999,
          background: 'rgba(0,0,0,0.35)',
          border: '1px solid rgba(251,191,36,0.4)',
          fontSize: 11, fontWeight: 700, color: '#FBBF24', letterSpacing: '0.06em',
        }}>
          📖 마법서 기록 · {RECORD.item} · {RECORD.amount.toLocaleString()}원
        </div>
      </div>

      {/* main stage */}
      <div style={{
        position: 'relative', zIndex: 2, flex: 1,
        display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
        padding: '0 24px',
      }}>
        {/* INTRO */}
        {phase === 'intro' && (
          <div style={{ textAlign: 'center', animation: 'fadeUp .4s ease' }}>
            <div style={{ fontSize: 60, marginBottom: 16, animation: 'wobble 2s ease-in-out infinite' }}>👀</div>
            <h2 style={{ margin: '0 0 8px', fontSize: 22, fontWeight: 900, color: '#fff' }}>
              어, 이상한 친구가 왔어!
            </h2>
            <p style={{ margin: 0, fontSize: 14, color: 'rgba(254,243,199,0.85)', lineHeight: 1.5 }}>
              네 마음 속에서 무언가가<br/>꼬물꼬물 나타나려고 해…
            </p>
          </div>
        )}

        {/* MONSTER */}
        {phase === 'monster' && (
          <div style={{ textAlign: 'center', animation: 'fadeUp .4s ease' }}>
            <div style={{ position: 'relative' }}>
              <Monster m={pair.monster} shake/>
            </div>
            <div style={{
              marginTop: 14, fontSize: 16, fontWeight: 800, color: pair.monster.color,
              textShadow: `0 0 12px ${pair.monster.color}`,
            }}>{pair.monster.name}</div>
            <div style={{ marginTop: 4, fontSize: 12, color: 'rgba(255,255,255,0.6)' }}>
              마음 속 작은 몬스터
            </div>
          </div>
        )}

        {/* CASTING */}
        {phase === 'casting' && (
          <div style={{ position: 'relative', textAlign: 'center', animation: 'fadeUp .25s ease' }}>
            <div style={{ position: 'relative', width: 220, height: 220 }}>

            </div>
            <div style={{
              marginTop: 6, fontSize: 18, fontWeight: 900, color: MAGIC.color,
              textShadow: `0 0 14px ${MAGIC.color}`,
              animation: 'pop .4s ease',
            }}>
              {MAGIC.emoji} {MAGIC.name} 마법!
            </div>
          </div>
        )}

        {/* REVEAL */}
        {phase === 'reveal' && (
          <div style={{ textAlign: 'center', animation: 'fadeUp .5s ease' }}>
            <Friend f={pair.friend}/>
            <div style={{
              marginTop: 16, display: 'inline-flex', alignItems: 'center', gap: 8,
              padding: '6px 14px', borderRadius: 999,
              background: `${pair.friend.color}22`, border: `1px solid ${pair.friend.color}77`,
              fontSize: 11, fontWeight: 700, color: pair.friend.color, letterSpacing: '0.05em',
            }}>
              {pair.friend.first ? '✦ NEW · 처음 만났어 ✦' : '✦ 다시 만났어 ✦'}
            </div>
            <h2 style={{
              margin: '12px 0 4px', fontSize: 26, fontWeight: 900,
              background: `linear-gradient(180deg, #fff 0%, ${pair.friend.glow} 100%)`,
              WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text',
            }}>
              {pair.friend.name}
            </h2>
            <div style={{ fontSize: 13, fontWeight: 700, color: pair.friend.glow, marginBottom: 8 }}>
              능력: {pair.friend.power}
            </div>
            <p style={{
              margin: 0, fontSize: 13, color: 'rgba(254,243,199,0.85)', lineHeight: 1.6,
              whiteSpace: 'pre-line',
            }}>{pair.friend.desc}</p>
          </div>
        )}

        {/* COLLECTED */}
        {phase === 'collected' && (
          <div style={{ textAlign: 'center', animation: 'fadeUp .4s ease' }}>
            <div style={{
              marginBottom: 18, position: 'relative',
              filter: `drop-shadow(0 0 14px ${pair.friend.color})`,
            }}>
              <Friend f={pair.friend}/>
            </div>
            {/* dex card */}
            <div style={{
              background: 'rgba(255,255,255,0.07)',
              border: `1px solid ${pair.friend.color}66`,
              borderRadius: 18, padding: '14px 18px',
              boxShadow: `0 8px 24px ${pair.friend.color}22, inset 0 1px 0 rgba(255,255,255,0.08)`,
              minWidth: 240,
            }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: '#FBBF24', letterSpacing: '0.1em', marginBottom: 4 }}>
                ✦ 마음 친구 도감 ✦
              </div>
              <div style={{ fontSize: 16, fontWeight: 800, color: '#fff' }}>
                {pair.friend.name} 도감에 추가됨!
              </div>
              <div style={{ height: 1, background: 'rgba(255,255,255,0.1)', margin: '10px 0' }}/>
              <div style={{ display: 'flex', justifyContent: 'space-around' }}>
                {['decision','plan','self','habit','learning'].map(id => {
                  const got = id === pair.friend.id || id === 'decision'; // mock collection
                  return (
                    <div key={id} style={{
                      width: 32, height: 32, borderRadius: '50%',
                      background: got
                        ? `linear-gradient(135deg, ${pair.friend.color}, ${pair.friend.glow})`
                        : 'rgba(255,255,255,0.06)',
                      border: `1.5px solid ${got ? pair.friend.color : 'rgba(255,255,255,0.15)'}`,
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      fontSize: 14, opacity: got ? 1 : 0.5,
                    }}>{got ? '✓' : '?'}</div>
                  );
                })}
              </div>
              <div style={{ marginTop: 8, fontSize: 11, color: 'rgba(255,255,255,0.55)' }}>
                2 / 5 친구 만남
              </div>
            </div>
            {/* coin reward */}
            <div style={{
              marginTop: 14, display: 'inline-flex', alignItems: 'center', gap: 8,
              padding: '8px 16px', borderRadius: 999,
              background: 'linear-gradient(135deg, #FBBF24, #D97706)',
              color: '#1E1B4B', fontSize: 14, fontWeight: 900,
              boxShadow: '0 4px 16px rgba(251,191,36,0.45)',
              animation: 'pop .5s cubic-bezier(.34,1.56,.64,1)',
            }}>
              <span style={{ fontSize: 18 }}>🪙</span> +15 마법 동전 획득!
            </div>
          </div>
        )}
      </div>

      {/* CTA */}
      <div style={{ position: 'relative', zIndex: 5, padding: '14px 20px 28px' }}>
        <button
          onClick={advance}
          disabled={phase === 'casting'}
          style={{
            width: '100%', height: 56, borderRadius: 18, border: 'none',
            fontFamily: 'inherit', fontSize: 16, fontWeight: 800, color: '#fff',
            cursor: phase === 'casting' ? 'wait' : 'pointer',
            background: phase === 'monster'
              ? `linear-gradient(135deg, ${MAGIC.color}, #1E40AF)`
              : phase === 'collected'
              ? 'rgba(255,255,255,0.12)'
              : 'linear-gradient(135deg, #F472B6 0%, #EC4899 50%, #BE185D 100%)',
            boxShadow: phase === 'monster'
              ? `0 10px 28px ${MAGIC.color}66, inset 0 1px 0 rgba(255,255,255,0.4)`
              : phase === 'collected'
              ? 'inset 0 0 0 1px rgba(255,255,255,0.18)'
              : '0 10px 28px rgba(236,72,153,0.55), inset 0 1px 0 rgba(255,255,255,0.4)',
            opacity: phase === 'casting' ? 0.5 : 1,
            transition: 'all .25s',
          }}
        >{ctaCopy}</button>
        <div style={{
          marginTop: 10, display: 'flex', justifyContent: 'center', gap: 6,
        }}>
          {PHASES.map((p, i) => (
            <div key={p} style={{
              width: phase === p ? 18 : 6, height: 4, borderRadius: 2,
              background: PHASES.indexOf(phase) >= i ? '#FBBF24' : 'rgba(255,255,255,0.15)',
              transition: 'all .3s',
            }}/>
          ))}
        </div>
      </div>

      <style>{`
        @keyframes monsterIdle { 0%,100%{transform:translateY(0)scale(1);} 50%{transform:translateY(-4px)scale(1.02);} }
        @keyframes monsterShake {
          0%,100% { transform: translate(0,0) rotate(0deg); }
          25% { transform: translate(-3px,-2px) rotate(-2deg); }
          50% { transform: translate(3px,1px) rotate(1deg); }
          75% { transform: translate(-2px,2px) rotate(-1deg); }
        }
        @keyframes friendFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
        @keyframes spinSlow { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
        @keyframes twinkle { 0%,100%{opacity:0.2;transform:scale(0.7);} 50%{opacity:1;transform:scale(1.2);} }
        @keyframes wobble {
          0%,100% { transform: rotate(-6deg); }
          50% { transform: rotate(6deg); }
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pop { 0%{transform:scale(0);} 70%{transform:scale(1.2);} 100%{transform:scale(1);} }
        @keyframes flashGrow {
          0% { width: 30px; height: 30px; opacity: 0.3; }
          50% { width: 200px; height: 200px; opacity: 1; }
          100% { width: 360px; height: 360px; opacity: 0; }
        }
        @keyframes ringPulse {
          0% { width: 40px; height: 40px; opacity: 0.9; }
          100% { width: 280px; height: 280px; opacity: 0; }
        }
        @keyframes shardOut {
          0% { opacity: 0; transform: rotate(var(--r,0deg)) translateY(-10px) scale(0.4); }
          50% { opacity: 1; }
          100% { opacity: 0; transform: rotate(var(--r,0deg)) translateY(-110px) scale(1); }
        }
      `}</style>
    </div>
  );
}

function App() {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <IOSDevice width={390} height={780} dark={true}>
        <Screen4 />
      </IOSDevice>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
