<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>경제 마법사 학교 — 화면 3</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<style>
  html, body {
    margin: 0; padding: 0;
    background: #0b0820;
    font-family: 'Pretendard', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #fff;
    overflow: hidden;
    height: 100%;
  }
  #root { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .phone-scroll::-webkit-scrollbar { width: 0; }
  input { font-family: inherit; }
  input::placeholder { color: rgba(255,255,255,0.32); }
  /* hide native number arrows */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef } = React;

// ─────────── data ───────────
const EMOTIONS = [
  { id: 'need',       emoji: '😍', label: '꼭\n필요했어',   color: '#84CC16', friend: '만족이' },
  { id: 'considered', emoji: '🤔', label: '잠깐\n고민했어', color: '#22D3EE', friend: '결단이' },
  { id: 'impulse',    emoji: '😅', label: '그냥\n갖고싶어', color: '#FBBF24', friend: '결단이' },
  { id: 'regret',     emoji: '😢', label: '사고나니\n후회돼', color: '#C084FC', friend: '배움이' },
  { id: 'satisfied',  emoji: '✨', label: '정말\n최고야!',  color: '#F472B6', friend: '만족이' },
];

const formatWon = (n) => {
  if (!n) return '';
  return Number(String(n).replace(/[^\d]/g, '')).toLocaleString('ko-KR');
};

// ─────────── Star particles ───────────
function StarField() {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.offsetWidth * devicePixelRatio;
    const h = canvas.height = canvas.offsetHeight * devicePixelRatio;
    const stars = Array.from({ length: 50 }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: (Math.random() * 1.2 + 0.4) * devicePixelRatio,
      vy: -(Math.random() * 0.2 + 0.04) * devicePixelRatio,
      a: Math.random() * 0.55 + 0.2,
      tw: Math.random() * Math.PI * 2,
    }));
    let raf;
    const tick = () => {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        s.y += s.vy; s.tw += 0.04;
        if (s.y < -5) { s.y = h + 5; s.x = Math.random() * w; }
        const a = s.a * (0.6 + 0.4 * Math.sin(s.tw));
        ctx.fillStyle = `rgba(255, 240, 200, ${a})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      raf = requestAnimationFrame(tick);
    };
    tick();
    return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={canvasRef} style={{
    position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none',
  }} />;
}

// ─────────── Spellbook header illustration ───────────
function Spellbook() {
  return (
    <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 4 }}>
      <svg width="100" height="70" viewBox="0 0 100 70" style={{
        filter: 'drop-shadow(0 6px 14px rgba(251,191,36,0.35))',
        animation: 'bookFloat 3s ease-in-out infinite',
      }}>
        <defs>
          <linearGradient id="pageG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#FEF3C7"/>
            <stop offset="100%" stopColor="#FDE68A"/>
          </linearGradient>
          <linearGradient id="leatherG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stopColor="#B45309"/>
            <stop offset="100%" stopColor="#7C2D12"/>
          </linearGradient>
        </defs>
        {/* leather covers */}
        <path d="M6 22 L48 18 L48 64 L8 60 Z" fill="url(#leatherG)"/>
        <path d="M94 22 L52 18 L52 64 L92 60 Z" fill="url(#leatherG)"/>
        {/* pages */}
        <path d="M10 24 L48 20 L48 60 L12 56 Z" fill="url(#pageG)"/>
        <path d="M90 24 L52 20 L52 60 L88 56 Z" fill="url(#pageG)"/>
        {/* spine glow */}
        <line x1="50" y1="20" x2="50" y2="62" stroke="#FBBF24" strokeWidth="1.5" opacity="0.7"/>
        {/* writing lines */}
        <line x1="16" y1="32" x2="42" y2="29" stroke="#92400E" strokeWidth="0.8" opacity="0.5"/>
        <line x1="16" y1="38" x2="40" y2="35" stroke="#92400E" strokeWidth="0.8" opacity="0.5"/>
        <line x1="16" y1="44" x2="42" y2="41" stroke="#92400E" strokeWidth="0.8" opacity="0.5"/>
        <line x1="58" y1="29" x2="84" y2="32" stroke="#92400E" strokeWidth="0.8" opacity="0.5"/>
        <line x1="58" y1="35" x2="82" y2="38" stroke="#92400E" strokeWidth="0.8" opacity="0.5"/>
        {/* gold star */}
        <text x="68" y="48" fontSize="10" fill="#FBBF24">✦</text>
        {/* sparkles */}
        <circle cx="14" cy="14" r="1.5" fill="#FBBF24">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="86" cy="16" r="1.2" fill="#22D3EE">
          <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="50" cy="8" r="1.8" fill="#fff">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
        </circle>
      </svg>
    </div>
  );
}

// ─────────── Field ───────────
function Field({ label, children, focused }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <label style={{
        display: 'block', fontSize: 13, fontWeight: 700,
        color: focused ? '#22D3EE' : '#FEF3C7',
        marginBottom: 6, paddingLeft: 4,
        transition: 'color .2s',
      }}>{label}</label>
      {children}
    </div>
  );
}

// ─────────── Toast ───────────
function Hint({ msg }) {
  return (
    <div style={{
      position: 'absolute', left: 20, right: 20, bottom: 96, zIndex: 200,
      background: 'rgba(190, 24, 93, 0.95)',
      border: '1px solid rgba(251,191,36,0.4)',
      color: '#fff', borderRadius: 14, padding: '12px 18px',
      fontSize: 13, fontWeight: 700, textAlign: 'center',
      boxShadow: '0 10px 30px rgba(0,0,0,0.5)',
      animation: 'hintIn .25s ease',
    }}>{msg}</div>
  );
}

// ─────────── Submit success overlay ───────────
function SubmitOverlay({ emotion, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2500); return () => clearTimeout(t); }, [onDone]);
  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 300,
      background: 'radial-gradient(circle at 50% 45%, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.85) 100%)',
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 14, padding: 24,
      animation: 'fadeIn .25s ease forwards',
    }}>
      <div style={{
        width: 130, height: 130, borderRadius: '50%',
        background: `radial-gradient(circle, ${emotion.color}aa 0%, ${emotion.color}33 50%, transparent 75%)`,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        animation: 'pulseBig 1.4s ease-out',
        boxShadow: `0 0 50px ${emotion.color}, 0 0 100px ${emotion.color}66`,
      }}>
        <span style={{ fontSize: 60, animation: 'pop .6s cubic-bezier(.34,1.56,.64,1)' }}>📖</span>
      </div>
      <div style={{ fontSize: 20, fontWeight: 900, color: '#fff', textAlign: 'center', textShadow: '0 0 12px rgba(251,191,36,0.6)' }}>
        마법서에 기록했어! ✨
      </div>
      <div style={{ fontSize: 13, color: '#FEF3C7', opacity: 0.9, textAlign: 'center', lineHeight: 1.5 }}>
        잠시만 기다려…<br/>
        <span style={{ color: emotion.color, fontWeight: 700 }}>{emotion.friend}</span>가 너를 만나러 오고 있어!
      </div>
      <div style={{ marginTop: 8, fontSize: 11, color: 'rgba(255,255,255,0.4)', fontStyle: 'italic' }}>
        다음 화면 4(친구 만나기) 진입 →
      </div>
    </div>
  );
}

// ─────────── Screen 3 ───────────
function Screen3() {
  const [item, setItem] = useState('');
  const [amount, setAmount] = useState('');
  const [emotion, setEmotion] = useState(null);
  const [focusKey, setFocusKey] = useState(null);
  const [hint, setHint] = useState(null);
  const [submitted, setSubmitted] = useState(null);

  const emotionObj = EMOTIONS.find(e => e.id === emotion);
  const ready = item.trim() && amount && emotion;

  const handleSubmit = () => {
    if (!item.trim()) { setHint('무엇을 샀는지 알려줘!'); return setTimeoutHint(); }
    if (!amount)      { setHint('얼마였는지 알려줘!');     return setTimeoutHint(); }
    if (!emotion)     { setHint('마음이 어땠는지 알려줘!'); return setTimeoutHint(); }
    setSubmitted(emotionObj);
  };
  const setTimeoutHint = () => setTimeout(() => setHint(null), 1800);

  const reset = () => {
    try {
      sessionStorage.setItem('lastEmotion', emotion);
      sessionStorage.setItem('lastItem', item);
      sessionStorage.setItem('lastAmount', String(amount));
    } catch (e) {}
    window.location.href = 'screen4.html';
  };

  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: 'radial-gradient(120% 80% at 50% 0%, #4C1D95 0%, #312E81 45%, #1E1B4B 100%)',
      overflow: 'hidden',
      display: 'flex', flexDirection: 'column',
    }}>
      <StarField />

      {/* top nav */}
      <div style={{
        position: 'relative', zIndex: 5, paddingTop: 60, paddingLeft: 16, paddingRight: 16, paddingBottom: 8,
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      }}>
        <button style={{
          background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)',
          color: '#fff', borderRadius: 999, width: 40, height: 40, fontSize: 18,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          cursor: 'pointer', fontFamily: 'inherit',
        }} onClick={() => { window.location.href = 'screen2.html'; }}>‹</button>
        <div style={{ fontSize: 11, fontWeight: 700, color: 'rgba(254,243,199,0.6)', letterSpacing: '0.1em' }}>
          오늘 · 5월 7일
        </div>
        <button onClick={() => { window.location.href = 'index.html'; }}
          title="프로토타입 홈"
          style={{
            background: 'rgba(0,0,0,0.45)', border: '1px solid rgba(255,255,255,0.18)',
            color: '#fff', borderRadius: 999, padding: '6px 12px', height: 32,
            fontSize: 12, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit',
            display: 'flex', alignItems: 'center', gap: 6,
          }}>🏠 <span>홈</span></button>
      </div>

      {/* scroll body */}
      <div className="phone-scroll" style={{
        position: 'relative', zIndex: 2,
        flex: 1, overflowY: 'auto', padding: '4px 20px 100px',
      }}>
        {/* header */}
        <div style={{ textAlign: 'center', marginBottom: 18 }}>
          <Spellbook/>
          <h1 style={{
            margin: '6px 0 4px', fontSize: 24, fontWeight: 900,
            background: 'linear-gradient(180deg, #FEF3C7 0%, #FBBF24 100%)',
            WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text',
          }}>📖 오늘의 마법서</h1>
          <p style={{ margin: 0, fontSize: 13, color: 'rgba(255,255,255,0.7)', fontWeight: 500 }}>
            오늘 너의 모험을 적어볼까?
          </p>
        </div>

        {/* card with inputs */}
        <div style={{
          background: 'rgba(255,255,255,0.06)',
          backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)',
          border: '1px solid rgba(251,191,36,0.35)',
          borderRadius: 20, padding: '20px 18px',
          boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 24px rgba(0,0,0,0.3)',
        }}>
          {/* item */}
          <Field label="✦  무엇을 샀어?" focused={focusKey === 'item'}>
            <input
              value={item}
              onChange={(e) => setItem(e.target.value)}
              onFocus={() => setFocusKey('item')}
              onBlur={() => setFocusKey(null)}
              placeholder="예) 슬라임"
              maxLength={20}
              style={{
                width: '100%', boxSizing: 'border-box',
                background: 'rgba(255,255,255,0.08)',
                border: `1.5px solid ${focusKey === 'item' ? '#22D3EE' : 'rgba(251,191,36,0.4)'}`,
                borderRadius: 12, padding: '14px 16px',
                color: '#fff', fontSize: 16, fontWeight: 600,
                outline: 'none',
                boxShadow: focusKey === 'item' ? '0 0 0 3px rgba(34,211,238,0.18), 0 0 16px rgba(34,211,238,0.25)' : 'none',
                transition: 'border-color .2s, box-shadow .2s',
              }}
            />
          </Field>

          {/* amount */}
          <Field label="✦  얼마였어?" focused={focusKey === 'amount'}>
            <div style={{ position: 'relative' }}>
              <input
                inputMode="numeric"
                value={formatWon(amount)}
                onChange={(e) => setAmount(e.target.value.replace(/[^\d]/g, '').slice(0, 7))}
                onFocus={() => setFocusKey('amount')}
                onBlur={() => setFocusKey(null)}
                placeholder="0"
                style={{
                  width: '100%', boxSizing: 'border-box',
                  background: 'rgba(255,255,255,0.08)',
                  border: `1.5px solid ${focusKey === 'amount' ? '#22D3EE' : 'rgba(251,191,36,0.4)'}`,
                  borderRadius: 12, padding: '14px 50px 14px 16px',
                  color: '#fff', fontSize: 18, fontWeight: 800, textAlign: 'right',
                  outline: 'none',
                  boxShadow: focusKey === 'amount' ? '0 0 0 3px rgba(34,211,238,0.18), 0 0 16px rgba(34,211,238,0.25)' : 'none',
                  transition: 'border-color .2s, box-shadow .2s',
                  letterSpacing: '0.02em',
                }}
              />
              <span style={{
                position: 'absolute', right: 16, top: '50%', transform: 'translateY(-50%)',
                fontSize: 14, fontWeight: 700, color: '#FBBF24', pointerEvents: 'none',
              }}>원</span>
            </div>
          </Field>

          {/* emotion */}
          <div style={{ marginTop: 4 }}>
            <label style={{
              display: 'block', fontSize: 13, fontWeight: 700, color: '#FEF3C7',
              marginBottom: 10, paddingLeft: 4,
            }}>✦  살 때 마음이 어땠어?</label>
            <div style={{
              display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8,
            }}>
              {EMOTIONS.map((e) => {
                const isSel = emotion === e.id;
                const isDim = emotion && !isSel;
                return (
                  <button
                    key={e.id}
                    onClick={() => setEmotion(e.id)}
                    style={{
                      position: 'relative',
                      background: isSel
                        ? `linear-gradient(160deg, ${e.color}33 0%, rgba(255,255,255,0.04) 100%)`
                        : 'rgba(255,255,255,0.06)',
                      border: `1.5px solid ${isSel ? e.color : 'rgba(255,255,255,0.12)'}`,
                      borderRadius: 14, padding: '12px 6px 10px',
                      cursor: 'pointer', color: '#fff', fontFamily: 'inherit',
                      opacity: isDim ? 0.4 : 1,
                      transform: isSel ? 'scale(1.06)' : 'scale(1)',
                      boxShadow: isSel
                        ? `0 0 0 3px ${e.color}33, 0 6px 18px ${e.color}55, inset 0 1px 0 rgba(255,255,255,0.1)`
                        : 'inset 0 1px 0 rgba(255,255,255,0.05)',
                      transition: 'all .25s cubic-bezier(.34,1.56,.64,1)',
                      display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
                    }}
                  >
                    <span style={{ fontSize: 30, lineHeight: 1, filter: isSel ? `drop-shadow(0 0 8px ${e.color})` : 'none' }}>{e.emoji}</span>
                    <span style={{
                      fontSize: 11, fontWeight: 700, lineHeight: 1.2, whiteSpace: 'pre-line',
                      color: isSel ? '#fff' : 'rgba(254,243,199,0.85)',
                    }}>{e.label}</span>
                    {isSel && (
                      <span style={{
                        position: 'absolute', top: 4, right: 4,
                        width: 18, height: 18, borderRadius: '50%',
                        background: e.color, color: '#1E1B4B',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        fontSize: 11, fontWeight: 900,
                      }}>✓</span>
                    )}
                  </button>
                );
              })}
            </div>
            {/* friend preview */}
            <div style={{
              marginTop: 12, height: 32,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              gap: 8, padding: '0 12px',
              borderRadius: 10,
              background: emotionObj ? `${emotionObj.color}15` : 'transparent',
              border: emotionObj ? `1px dashed ${emotionObj.color}77` : '1px dashed transparent',
              fontSize: 12, color: emotionObj ? emotionObj.color : 'transparent',
              fontWeight: 700, transition: 'all .25s',
            }}>
              {emotionObj && <>적으면 <strong style={{ fontWeight: 900 }}>{emotionObj.friend}</strong>를 만날 수 있어 ✨</>}
            </div>
          </div>
        </div>

        {/* small footer note */}
        <p style={{
          textAlign: 'center', fontSize: 11, color: 'rgba(255,255,255,0.35)',
          marginTop: 14, lineHeight: 1.5,
        }}>
          마법서에 적힌 모든 모험은<br/>너의 마음 친구 도감에 차곡차곡 모여요
        </p>
      </div>

      {/* sticky CTA */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 50,
        padding: '14px 20px 28px',
        background: 'linear-gradient(to top, rgba(30,27,75,0.95) 0%, rgba(30,27,75,0.85) 60%, transparent 100%)',
        pointerEvents: 'none',
      }}>
        <button
          onClick={handleSubmit}
          disabled={!ready}
          style={{
            pointerEvents: 'auto',
            width: '100%', height: 60, borderRadius: 18, border: 'none',
            fontFamily: 'inherit', fontSize: 17, fontWeight: 800, color: '#fff',
            cursor: ready ? 'pointer' : 'not-allowed',
            background: ready
              ? 'linear-gradient(135deg, #F472B6 0%, #EC4899 50%, #BE185D 100%)'
              : 'rgba(255,255,255,0.08)',
            boxShadow: ready
              ? '0 10px 28px rgba(236,72,153,0.55), inset 0 1px 0 rgba(255,255,255,0.4)'
              : 'inset 0 0 0 1px rgba(255,255,255,0.08)',
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
            transition: 'transform .12s, background .25s, box-shadow .25s',
            color: ready ? '#fff' : 'rgba(255,255,255,0.4)',
          }}
          onMouseDown={e => ready && (e.currentTarget.style.transform = 'scale(0.98)')}
          onMouseUp={e => (e.currentTarget.style.transform = 'scale(1)')}
          onMouseLeave={e => (e.currentTarget.style.transform = 'scale(1)')}
        >
          마법서에 적기 <span style={{ fontSize: 19 }}>✍️</span>
        </button>
      </div>

      {hint && <Hint msg={hint}/>}
      {submitted && <SubmitOverlay emotion={submitted} onDone={reset}/>}

      <style>{`
        @keyframes bookFloat {
          0%, 100% { transform: translateY(0) rotate(-2deg); }
          50%      { transform: translateY(-4px) rotate(2deg); }
        }
        @keyframes hintIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulseBig {
          0%   { transform: scale(0.4); opacity: 0; }
          40%  { transform: scale(1.15); opacity: 1; }
          100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pop {
          0% { transform: scale(0); }
          70% { transform: scale(1.2); }
          100% { transform: scale(1); }
        }
      `}</style>
    </div>
  );
}

function App() {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <IOSDevice width={390} height={780} dark={true}>
        <Screen3 />
      </IOSDevice>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
