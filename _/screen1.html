<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>경제 마법사 학교 — 화면 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<style>
  html, body {
    margin: 0; padding: 0;
    background: #0b0820;
    font-family: 'Pretendard', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #fff;
    overflow: hidden;
    height: 100%;
  }
  #root { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useMemo } = React;

// ─────────── data ───────────
const ELEMENTS = [
  { id: 'fire',     emoji: '🔥', label: '불',   color: '#F97316', glow: '#FB923C', name: '불',   tag: '용기와 결단력의 마법사' },
  { id: 'water',    emoji: '💧', label: '물',   color: '#38BDF8', glow: '#7DD3FC', name: '물',   tag: '차분한 인내심의 마법사' },
  { id: 'electric', emoji: '⚡', label: '전기', color: '#FACC15', glow: '#FDE68A', name: '전기', tag: '빠른 통찰의 마법사' },
  { id: 'earth',    emoji: '🌱', label: '흙',   color: '#84CC16', glow: '#BEF264', name: '흙',   tag: '단단한 꾸준함의 마법사' },
  { id: 'wind',     emoji: '🌬️', label: '바람', color: '#C084FC', glow: '#DDD6FE', name: '바람', tag: '따뜻한 나눔의 마법사' },
];

// ─────────── Star particles ───────────
function StarField() {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.offsetWidth * devicePixelRatio;
    const h = canvas.height = canvas.offsetHeight * devicePixelRatio;
    const stars = Array.from({ length: 70 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: (Math.random() * 1.4 + 0.4) * devicePixelRatio,
      vy: -(Math.random() * 0.25 + 0.05) * devicePixelRatio,
      a: Math.random() * 0.6 + 0.2,
      tw: Math.random() * Math.PI * 2,
    }));
    let raf;
    const tick = () => {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        s.y += s.vy;
        s.tw += 0.04;
        if (s.y < -5) { s.y = h + 5; s.x = Math.random() * w; }
        const a = s.a * (0.6 + 0.4 * Math.sin(s.tw));
        ctx.fillStyle = `rgba(255, 240, 200, ${a})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      raf = requestAnimationFrame(tick);
    };
    tick();
    return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={canvasRef} style={{
    position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none',
  }} />;
}

// ─────────── Coin ───────────
function Coin({ el, state, onClick, idx }) {
  // state: 'idle' | 'hover' | 'selected' | 'dimmed'
  const [hover, setHover] = useState(false);
  const isSelected = state === 'selected';
  const isDimmed = state === 'dimmed';
  const spinning = (hover && !isDimmed) || isSelected === false && hover;

  return (
    <div
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      onClick={onClick}
      style={{
        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8,
        cursor: isDimmed ? 'pointer' : 'pointer',
        opacity: isDimmed ? 0.35 : 1,
        transform: isSelected ? 'scale(1.12)' : 'scale(1)',
        transition: 'opacity .35s ease, transform .35s cubic-bezier(.34,1.56,.64,1)',
        animation: `float-${idx} 2s ease-in-out infinite`,
        animationDelay: `${idx * 0.18}s`,
      }}
    >
      <div style={{ perspective: 600, width: 84, height: 84 }}>
        <div style={{
          position: 'relative', width: 84, height: 84,
          transformStyle: 'preserve-3d',
          animation: hover && !isSelected ? 'coinSpin 1.5s linear infinite' : 'none',
          filter: isSelected
            ? `drop-shadow(0 0 16px ${el.glow}) drop-shadow(0 0 28px ${el.color})`
            : (hover ? `drop-shadow(0 0 14px #FBBF24) drop-shadow(0 0 22px rgba(251,191,36,0.5))`
                     : 'drop-shadow(0 6px 10px rgba(0,0,0,0.45))'),
          transition: 'filter .3s ease',
        }}>
          {/* Front face */}
          <div style={{
            position: 'absolute', inset: 0, borderRadius: '50%',
            background: 'radial-gradient(circle at 30% 28%, #FEF3C7 0%, #FCD34D 32%, #D97706 78%, #92400E 100%)',
            border: isSelected ? '3px solid #FEF3C7' : '2px solid #B45309',
            boxShadow: 'inset 0 -3px 6px rgba(120,53,15,0.6), inset 0 3px 6px rgba(255,243,199,0.6)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            backfaceVisibility: 'hidden',
          }}>
            {/* inner ring engraved */}
            <div style={{
              position: 'absolute', inset: 7, borderRadius: '50%',
              border: '1.5px dashed rgba(120,53,15,0.55)',
            }} />
            <span style={{ fontSize: 38, lineHeight: 1, filter: 'drop-shadow(0 1px 0 rgba(255,255,255,0.4))' }}>
              {el.emoji}
            </span>
          </div>
          {/* Back face (edge tone) */}
          <div style={{
            position: 'absolute', inset: 0, borderRadius: '50%',
            background: 'linear-gradient(135deg, #B45309 0%, #FCD34D 50%, #B45309 100%)',
            transform: 'rotateY(180deg)',
            border: '2px solid #92400E',
            backfaceVisibility: 'hidden',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <div style={{
              width: 48, height: 48, borderRadius: '50%',
              border: '2px solid rgba(120,53,15,0.7)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 22, color: '#7C2D12', fontWeight: 800,
            }}>✦</div>
          </div>
        </div>
      </div>
      <span style={{
        fontSize: 14, fontWeight: 700,
        color: isSelected ? el.glow : '#FEF3C7',
        textShadow: isSelected ? `0 0 8px ${el.color}` : '0 1px 2px rgba(0,0,0,0.4)',
        letterSpacing: '0.02em',
        transition: 'color .3s, text-shadow .3s',
      }}>{el.label}</span>
    </div>
  );
}

// ─────────── Awakening overlay ───────────
function Awakening({ el, onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 2200);
    return () => clearTimeout(t);
  }, [onDone]);
  if (!el) return null;
  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 100,
      background: 'radial-gradient(circle at 50% 45%, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.85) 100%)',
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      gap: 18, padding: 24,
      animation: 'fadeIn .25s ease forwards',
    }}>
      <div style={{
        width: 140, height: 140, borderRadius: '50%',
        background: `radial-gradient(circle, ${el.glow} 0%, ${el.color} 45%, transparent 75%)`,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        animation: 'pulseBig 1.4s ease-out',
        boxShadow: `0 0 60px ${el.color}, 0 0 120px ${el.glow}`,
      }}>
        <span style={{ fontSize: 72, animation: 'pop .6s cubic-bezier(.34,1.56,.64,1)' }}>{el.emoji}</span>
      </div>
      <div style={{
        fontSize: 22, fontWeight: 800, color: '#fff', textAlign: 'center',
        textShadow: `0 0 12px ${el.color}`,
      }}>
        {el.name}의 힘이 깨어났어!
      </div>
      <div style={{ fontSize: 14, color: '#FEF3C7', opacity: 0.9 }}>
        {el.tag}
      </div>
    </div>
  );
}

// ─────────── Screen ───────────
function Screen1() {
  const [selected, setSelected] = useState(null);
  const [awakening, setAwakening] = useState(null);
  const [completed, setCompleted] = useState(false);

  const sel = ELEMENTS.find(e => e.id === selected) || null;

  const handleSubmit = () => {
    if (!sel) return;
    setAwakening(sel);
  };

  const handleDone = () => {
    setAwakening(null);
    setCompleted(true);
    try { sessionStorage.setItem('selectedMagic', sel.id); } catch (e) {}
    setTimeout(() => { window.location.href = 'screen2.html'; }, 400);
  };

  const reset = () => { setSelected(null); setAwakening(null); setCompleted(false); };

  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: 'radial-gradient(120% 80% at 50% 0%, #4C1D95 0%, #312E81 45%, #1E1B4B 100%)',
      overflow: 'hidden',
      display: 'flex', flexDirection: 'column',
      paddingTop: 60, paddingBottom: 44,
    }}>
      <StarField />

      <button onClick={() => { window.location.href = 'index.html'; }}
        title="프로토타입 홈"
        style={{
          position: 'absolute', top: 12, left: 12, zIndex: 50,
          background: 'rgba(0,0,0,0.45)', border: '1px solid rgba(255,255,255,0.18)',
          color: '#fff', borderRadius: 999, padding: '6px 12px',
          fontSize: 12, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit',
          display: 'flex', alignItems: 'center', gap: 6,
        }}>🏠 <span>홈</span></button>

      {/* Header */}
      <div style={{
        position: 'relative', zIndex: 2, textAlign: 'center', padding: '8px 24px 0',
      }}>
        <div style={{
          display: 'inline-flex', alignItems: 'center', gap: 6,
          padding: '6px 14px', borderRadius: 999,
          background: 'rgba(251,191,36,0.12)',
          border: '1px solid rgba(251,191,36,0.4)',
          fontSize: 11, fontWeight: 700, color: '#FBBF24', letterSpacing: '0.08em',
          marginBottom: 10,
        }}>
          ✦ 입학식 · CHAPTER 0 ✦
        </div>
        <h1 style={{
          margin: '4px 0 6px',
          fontSize: 26, fontWeight: 900,
          background: 'linear-gradient(180deg, #FEF3C7 0%, #FBBF24 100%)',
          WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent',
          backgroundClip: 'text',
          letterSpacing: '-0.01em',
          textShadow: '0 0 20px rgba(251,191,36,0.25)',
        }}>
          ✨ 경제 마법사 학교 ✨
        </h1>
        <p style={{
          margin: '6px 0 2px', fontSize: 15, lineHeight: 1.45, fontWeight: 600,
          color: '#FEF3C7',
        }}>
          네 안에 어떤 마법의 힘이<br/>깨어나고 있을까?
        </p>
        <p style={{
          margin: '6px 0 0', fontSize: 12, color: 'rgba(255,255,255,0.65)', fontWeight: 500,
        }}>
          동전 위에 마우스를 올려서 느껴봐 ✨
        </p>
      </div>

      {/* Coins area */}
      <div style={{
        position: 'relative', zIndex: 2, flex: 1,
        display: 'flex', flexDirection: 'column', justifyContent: 'center',
        gap: 18, padding: '20px 16px 0',
      }}>
        {/* Row 1: 2 coins */}
        <div style={{ display: 'flex', justifyContent: 'center', gap: 36 }}>
          {ELEMENTS.slice(0, 2).map((el, i) => (
            <Coin key={el.id} el={el} idx={i}
              state={selected == null ? 'idle' : (selected === el.id ? 'selected' : 'dimmed')}
              onClick={() => setSelected(el.id)} />
          ))}
        </div>
        {/* Row 2: 3 coins */}
        <div style={{ display: 'flex', justifyContent: 'center', gap: 22 }}>
          {ELEMENTS.slice(2).map((el, i) => (
            <Coin key={el.id} el={el} idx={i + 2}
              state={selected == null ? 'idle' : (selected === el.id ? 'selected' : 'dimmed')}
              onClick={() => setSelected(el.id)} />
          ))}
        </div>

        {/* Selected hint */}
        <div style={{
          textAlign: 'center', minHeight: 22, marginTop: 6,
          fontSize: 13, color: sel ? sel.glow : 'rgba(255,255,255,0.35)',
          fontWeight: 700, letterSpacing: '0.02em',
          textShadow: sel ? `0 0 10px ${sel.color}` : 'none',
          transition: 'color .3s',
        }}>
          {sel ? `${sel.emoji} ${sel.tag}` : '동전 하나를 골라봐'}
        </div>
      </div>

      {/* CTA */}
      <div style={{ position: 'relative', zIndex: 2, padding: '12px 24px 24px' }}>
        <button
          onClick={handleSubmit}
          disabled={!sel}
          style={{
            width: '100%', height: 56, borderRadius: 16, border: 'none',
            fontFamily: 'inherit', fontSize: 17, fontWeight: 800,
            color: '#fff', letterSpacing: '0.02em',
            cursor: sel ? 'pointer' : 'not-allowed',
            background: sel
              ? 'linear-gradient(135deg, #F472B6 0%, #EC4899 50%, #BE185D 100%)'
              : 'rgba(255,255,255,0.08)',
            boxShadow: sel
              ? '0 8px 22px rgba(236,72,153,0.45), inset 0 1px 0 rgba(255,255,255,0.35)'
              : 'inset 0 0 0 1px rgba(255,255,255,0.08)',
            transition: 'transform .15s, box-shadow .25s, background .25s',
            transform: 'translateZ(0)',
          }}
          onMouseDown={e => sel && (e.currentTarget.style.transform = 'scale(0.98)')}
          onMouseUp={e => (e.currentTarget.style.transform = 'scale(1)')}
          onMouseLeave={e => (e.currentTarget.style.transform = 'scale(1)')}
        >
          {sel ? `선택 완료  ▶` : '속성을 먼저 골라봐'}
        </button>
        {completed && (
          <button onClick={reset} style={{
            display: 'block', margin: '12px auto 0', background: 'transparent', border: 'none',
            color: 'rgba(255,255,255,0.55)', fontSize: 12, cursor: 'pointer', textDecoration: 'underline',
            fontFamily: 'inherit',
          }}>다시 선택하기</button>
        )}
      </div>

      {awakening && <Awakening el={awakening} onDone={handleDone} />}

      <style>{`
        @keyframes coinSpin {
          0%   { transform: rotateY(0deg); }
          100% { transform: rotateY(360deg); }
        }
        @keyframes float-0 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        @keyframes float-1 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        @keyframes float-2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        @keyframes float-3 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        @keyframes float-4 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulseBig {
          0%   { transform: scale(0.4); opacity: 0; }
          40%  { transform: scale(1.15); opacity: 1; }
          100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pop {
          0% { transform: scale(0); }
          70% { transform: scale(1.2); }
          100% { transform: scale(1); }
        }
      `}</style>
    </div>
  );
}

// ─────────── App: phone frame ───────────
function App() {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 32, padding: 24 }}>
      <IOSDevice width={390} height={780} dark={true}>
        <Screen1 />
      </IOSDevice>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
