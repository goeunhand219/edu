// ─────────── Star particles (shared) ───────────
function StarField() {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.offsetWidth * devicePixelRatio;
    const h = canvas.height = canvas.offsetHeight * devicePixelRatio;
    const stars = Array.from({ length: 60 }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: (Math.random() * 1.3 + 0.4) * devicePixelRatio,
      vy: -(Math.random() * 0.22 + 0.04) * devicePixelRatio,
      a: Math.random() * 0.55 + 0.2,
      tw: Math.random() * Math.PI * 2,
    }));
    let raf;
    const tick = () => {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        s.y += s.vy; s.tw += 0.04;
        if (s.y < -5) { s.y = h + 5; s.x = Math.random() * w; }
        const a = s.a * (0.6 + 0.4 * Math.sin(s.tw));
        ctx.fillStyle = `rgba(255, 240, 200, ${a})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      raf = requestAnimationFrame(tick);
    };
    tick();
    return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={canvasRef} style={{
    position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none',
  }} />;
}

// ─────────── Card ───────────
function Card({ children, accent = '#FBBF24', style = {}, onClick }) {
  return (
    <div
      onClick={onClick}
      style={{
        background: 'rgba(255,255,255,0.07)',
        backdropFilter: 'blur(8px)',
        WebkitBackdropFilter: 'blur(8px)',
        border: `1px solid ${accent}55`,
        borderRadius: 18,
        padding: 16,
        boxShadow: `inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 12px rgba(0,0,0,0.25)`,
        cursor: onClick ? 'pointer' : 'default',
        transition: 'transform .15s, border-color .2s',
        ...style,
      }}
      onMouseEnter={onClick ? (e) => e.currentTarget.style.borderColor = accent : undefined}
      onMouseLeave={onClick ? (e) => e.currentTarget.style.borderColor = accent + '55' : undefined}
    >{children}</div>
  );
}

// ─────────── Toast ───────────
function Toast({ msg, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 1800); return () => clearTimeout(t); }, [onDone]);
  return (
    <div style={{
      position: 'absolute', left: 24, right: 24, bottom: 90, zIndex: 200,
      background: 'rgba(30, 27, 75, 0.92)',
      border: '1px solid rgba(251,191,36,0.45)',
      color: '#FEF3C7', borderRadius: 14, padding: '14px 18px',
      fontSize: 13.5, fontWeight: 600, textAlign: 'center',
      boxShadow: '0 10px 30px rgba(0,0,0,0.5)',
      animation: 'toastIn .25s ease, toastOut .25s ease 1.55s forwards',
    }}>{msg}</div>
  );
}

          오늘의 소비 기록하기
        </button>
      </div>

      {toast && <Toast msg={toast} onDone={() => setToast(null)}/>}

      <style>{`
        @keyframes wizFloat {
          0%, 100% { transform: translateY(0) rotate(-1deg); }
          50%      { transform: translateY(-6px) rotate(1deg); }
        }
        @keyframes wizShake {
          0%, 100% { transform: translateX(0); }
          20% { transform: translateX(-4px) rotate(-3deg); }
          40% { transform: translateX(4px) rotate(3deg); }
          60% { transform: translateX(-3px) rotate(-2deg); }
          80% { transform: translateX(3px) rotate(2deg); }
        }
        @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateY(8px); } }
      `}</style>
    </div>
  );
}

function App() {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <IOSDevice width={390} height={780} dark={true}>
        <Screen2 />
      </IOSDevice>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
