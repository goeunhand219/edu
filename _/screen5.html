// ─────────── Star particles ───────────
function StarField() {
  const ref = useRef();
  useEffect(() => {
    const c = ref.current; const ctx = c.getContext('2d');
    const w = c.width = c.offsetWidth * devicePixelRatio;
    const h = c.height = c.offsetHeight * devicePixelRatio;
    const stars = Array.from({ length: 45 }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: (Math.random() * 1.2 + 0.4) * devicePixelRatio,
      vy: -(Math.random() * 0.2 + 0.04) * devicePixelRatio,
      a: Math.random() * 0.55 + 0.2, tw: Math.random() * Math.PI * 2,
    }));
    let raf;
    const tick = () => {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        s.y += s.vy; s.tw += 0.04;
        if (s.y < -5) { s.y = h + 5; s.x = Math.random() * w; }
        const a = s.a * (0.6 + 0.4 * Math.sin(s.tw));
        ctx.fillStyle = `rgba(255, 240, 200, ${a})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      raf = requestAnimationFrame(tick);
    };
    tick();
    return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={ref} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none' }}/>;
}

function LessonCard({ card, idx, total, onAnswered, answer, showResult }) {

  }

  if (card.kind === 'concept') {
    return (

        <div style={{ fontSize: 11, fontWeight: 700, color: '#22D3EE', letterSpacing: '0.1em' }}>{card.tag}</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 10 }}>

            width: 40, height: 40, borderRadius: 12,
            background: 'linear-gradient(135deg, rgba(34,211,238,0.2), rgba(34,211,238,0.05))',
            border: '1px solid rgba(34,211,238,0.4)',

          }}>{card.icon}</div>
          <h3 style={{ margin: 0, fontSize: 18, fontWeight: 900, color: '#fff' }}>{card.title}</h3>
        </div>

        {/* visual */}

        </div>

        <p style={{

        <div style={{
          marginTop: 'auto',
          padding: '12px 14px', borderRadius: 12,
          background: 'linear-gradient(135deg, rgba(251,191,36,0.15), rgba(236,72,153,0.1))',
          border: '1px solid rgba(251,191,36,0.4)',

        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 10 }}>
          <div style={{
            width: 40, height: 40, borderRadius: 12,
            background: 'linear-gradient(135deg, rgba(244,114,182,0.25), rgba(190,24,93,0.1))',
            border: '1px solid rgba(244,114,182,0.4)',

          {card.options.map(opt => {

          color: '#1E1B4B', fontSize: 14, fontWeight: 900,
          boxShadow: '0 6px 18px rgba(251,191,36,0.45)',

          <span style={{ fontSize: 18 }}>🪙</span> +{card.reward} 마법 동전

        {/* badge unlocked */}
        <div style={{

          background: 'rgba(255,255,255,0.06)', border: '1px dashed rgba(251,191,36,0.4)',
          fontSize: 12, color: '#FEF3C7', fontWeight: 700,
        }}>
          📛 새 배움 카드 획득: <span style={{ color: '#FBBF24' }}>{card.newBadge}</span>
        </div>
      </div>
    );
  }
  return null;
}

// ─────────── Screen 5 ───────────
function Screen5() {
  const [idx, setIdx] = useState(0);
  const [quizAnswer, setQuizAnswer] = useState(null);
  const [quizRevealed, setQuizRevealed] = useState(false);
  const total = LESSON.cards.length;
  const card = LESSON.cards[idx];

  const isQuiz = card.kind === 'quiz';
  const canAdvance = !isQuiz || quizRevealed;

  const onAnswered = (id) => {
    setQuizAnswer(id);
    setTimeout(() => setQuizRevealed(true), 250);
  };

  const next = () => {
    if (idx === total - 1) { window.location.href = 'screen2.html'; return; }
    if (idx < total - 1) setIdx(idx + 1);
    else { setIdx(0); setQuizAnswer(null); setQuizRevealed(false); }
  };
  const prev = () => { if (idx > 0) setIdx(idx - 1); };

  // reset quiz state when leaving quiz
  useEffect(() => {
    if (card.kind !== 'quiz') { setQuizAnswer(null); setQuizRevealed(false); }
  }, [idx]);

  const ctaCopy = card.kind === 'reward' ? '메인으로 돌아가기 ↩'
                : card.kind === 'quiz' && !quizRevealed ? '답을 골라봐'
                : idx === total - 2 ? '수업 마무리 →'
                : '다음 →';

  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: 'radial-gradient(120% 80% at 50% 0%, #4C1D95 0%, #312E81 45%, #1E1B4B 100%)',
      overflow: 'hidden', display: 'flex', flexDirection: 'column',
    }}>
      <StarField/>

      {/* top bar */}
      <div style={{
        position: 'relative', zIndex: 5,
        paddingTop: 60, padding: '60px 16px 8px',
        display: 'flex', alignItems: 'center', gap: 10,
      }}>
        <button onClick={prev} disabled={idx === 0} style={{
          background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)',
          color: '#fff', borderRadius: 999, width: 36, height: 36, fontSize: 16,
          opacity: idx === 0 ? 0.3 : 1,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          cursor: idx === 0 ? 'default' : 'pointer', fontFamily: 'inherit',
        }}>‹</button>

        {/* progress bar with dots */}
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 5 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
            <div style={{ fontSize: 10, fontWeight: 700, color: '#FBBF24', letterSpacing: '0.08em' }}>
              📚 DAY {LESSON.day} · {LESSON.subtitle}
            </div>
            <div style={{ fontSize: 10, color: 'rgba(255,255,255,0.5)' }}>
              {idx + 1} / {total}
            </div>
          </div>
          <div style={{
            height: 5, borderRadius: 3, background: 'rgba(255,255,255,0.08)', overflow: 'hidden',
          }}>
            <div style={{
              width: `${((idx + 1) / total) * 100}%`, height: '100%',
              background: 'linear-gradient(90deg, #FBBF24, #F472B6)',
              borderRadius: 3, transition: 'width .35s ease',
              boxShadow: '0 0 8px #FBBF24',
            }}/>
          </div>
        </div>

        <button onClick={() => { window.location.href = 'screen2.html'; }} style={{
          background: 'transparent', border: 'none', color: 'rgba(255,255,255,0.55)',
          fontSize: 18, cursor: 'pointer', width: 36, height: 36, fontFamily: 'inherit',
        }}>✕</button>
      </div>

      {/* card stack area */}
      <div style={{
        position: 'relative', zIndex: 2, flex: 1,
        padding: '14px 18px 14px',
        display: 'flex', flexDirection: 'column',
      }}>
        {/* ghost cards behind */}

          {idx + 1 < total && (
            <div style={{
              position: 'absolute', inset: 0,
              background: 'rgba(255,255,255,0.04)', borderRadius: 22,
              border: '1px solid rgba(251,191,36,0.18)',
              transform: 'translateY(14px) scale(0.95)',
              opacity: 0.6,
            }}/>
          )}
          {idx + 2 < total && (
            <div style={{
              position: 'absolute', inset: 0,
              background: 'rgba(255,255,255,0.025)', borderRadius: 22,
              border: '1px solid rgba(251,191,36,0.1)',
              transform: 'translateY(28px) scale(0.9)',
              opacity: 0.4,
            }}/>
          )}

          {/* main card */}
          <div key={idx} style={{
            position: 'relative', height: '100%',
            background: 'rgba(255,255,255,0.07)',
            backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)',
            border: '1px solid rgba(251,191,36,0.5)',
            borderRadius: 22,
            boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.1), 0 12px 30px rgba(0,0,0,0.35)',
            overflow: 'hidden',
            animation: 'cardIn .35s cubic-bezier(.34,1.4,.64,1)',
            display: 'flex', flexDirection: 'column',
          }}>
            <LessonCard card={card} idx={idx} total={total}
              answer={quizAnswer} showResult={quizRevealed} onAnswered={onAnswered}/>
          </div>
        </div>
      </div>

      {/* CTA */}
      <div style={{ position: 'relative', zIndex: 5, padding: '4px 20px 28px' }}>
        <button
          onClick={next}
          disabled={!canAdvance}
          style={{
            width: '100%', height: 54, borderRadius: 16, border: 'none',
            fontFamily: 'inherit', fontSize: 16, fontWeight: 800, color: '#fff',
            cursor: canAdvance ? 'pointer' : 'not-allowed',
            background: canAdvance
              ? (card.kind === 'reward'
                  ? 'linear-gradient(135deg, #FCD34D 0%, #D97706 100%)'
                  : 'linear-gradient(135deg, #F472B6 0%, #EC4899 50%, #BE185D 100%)')
              : 'rgba(255,255,255,0.08)',
            color: canAdvance ? (card.kind === 'reward' ? '#1E1B4B' : '#fff') : 'rgba(255,255,255,0.4)',
            boxShadow: canAdvance
              ? (card.kind === 'reward'
                  ? '0 10px 28px rgba(251,191,36,0.55)'
                  : '0 10px 28px rgba(236,72,153,0.55)')
              : 'inset 0 0 0 1px rgba(255,255,255,0.08)',
            transition: 'all .2s',
          }}
        >{ctaCopy}</button>
      </div>

      <style>{`
        @keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(0.97); } to { opacity: 1; transform: none; } }
        @keyframes cardIcon { 0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-4px) rotate(3deg);} }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseBig {
          0% { transform: scale(0.4); opacity: 0; }
          50% { transform: scale(1.1); opacity: 1; }
          100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pop { 0%{transform:scale(0);} 70%{transform:scale(1.2);} 100%{transform:scale(1);} }
      `}</style>
    </div>
  );
}

function App() {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <IOSDevice width={390} height={780} dark={true}><Screen5/></IOSDevice>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
